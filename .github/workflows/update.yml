name: update geo bases

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: cut
        run: |
          set -e
          SRC=https://raw.githubusercontent.com/runetfreedom/russia-v2ray-rules-dat/release
          curl -sfL -o geoip-src.dat  $SRC/geoip.dat
          curl -sfL -o geosite-src.dat $SRC/geosite.dat
          python3 cut.py geoip-src.dat  geoip.dat  ru private
          python3 cut.py geosite-src.dat geosite.dat private ru-available-only-inside
          rm -f geoip-src.dat geosite-src.dat

      - name: commit
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add geoip.dat geosite.dat
          git diff --staged --quiet || git commit -m "update geo bases"
          git push
